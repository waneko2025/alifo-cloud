<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALIFO Cloud</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside>
    <div class="logo">☁ <span>ALIFO Cloud</span></div>
    <nav>
      <button class="nav active">📁 マイファイル</button>
      <button class="nav" disabled>⭐ お気に入り</button>
      <button class="nav" disabled>🕘 最近使用したファイル</button>
      <button class="nav" disabled>🗑️ ゴミ箱</button>
      <button class="nav" disabled>🤖 ALIFO AI</button>
    </nav>
    <div class="sideBottom">v1.0 · ALIFO Cloud</div>
  </aside>

  <main>
    <header>
      <div>
        <h1>マイファイル</h1>
        <div id="breadcrumb" class="breadcrumb">ホーム</div>
      </div>
      <div class="actions">
        <button id="newFolder" class="secondary">＋ 新しいフォルダ</button>
        <label class="primary">⬆ ファイルをアップロード
          <input id="fileInput" type="file" multiple hidden>
        </label>
      </div>
    </header>

    <section class="toolbar">
      <button id="backBtn" class="secondary">← 戻る</button>
      <span id="status">読み込み中…</span>
    </section>

    <div id="drop" class="drop">
      <strong>ファイルをここにドラッグ＆ドロップ</strong>
      <span>または「ファイルをアップロード」を押してください</span>
    </div>

    <section id="grid" class="grid"></section>
    <div id="empty" class="empty" hidden>このフォルダは空です</div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
